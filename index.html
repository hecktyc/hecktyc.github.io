<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>hecktyc</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0px) 1rem env(safe-area-inset-bottom, 0px);
      overflow: hidden;
    }

    h1 {
      position: relative;
      isolation: isolate;
      margin: 0;
      color: var(--fg);
      font-family: "Orbitron", "Audiowide", "Eurostile", "Bank Gothic", "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: clamp(2.5rem, 13vw, 9rem);
      letter-spacing: 0.12em;
      text-transform: lowercase;
      text-align: center;
      text-shadow:
        /* soft 3D extrusion, cool-tinted */
        1px 1px 0 rgba(215, 230, 255, 0.85),
        2px 2px 0 rgba(180, 200, 255, 0.6),
        3px 3px 0 rgba(150, 170, 245, 0.4),
        4px 4px 3px rgba(110, 130, 225, 0.25),
        /* bright white core glow */
        0 0 6px #fff,
        0 0 16px rgba(255, 255, 255, 0.95),
        0 0 34px rgba(255, 255, 255, 0.7),
        /* faint chromatic fringes */
        -2px 0 12px rgba(0, 240, 255, 0.55),
        2px 0 12px rgba(255, 60, 220, 0.5),
        /* wide halo */
        0 0 70px rgba(150, 130, 255, 0.55),
        0 0 120px rgba(90, 200, 255, 0.4);
    }

    /* iridescent layer: a blurred copy of the text, behind it, with colours that drift */
    h1::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      z-index: -1;
      color: transparent;
      background: linear-gradient(100deg,
        #5ef2ff, #a78bff, #ff7ad9, #ffe27a, #7affc2, #5ef2ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      filter: blur(14px) saturate(1.3);
      opacity: 0.75;
      text-shadow: none;
      animation: drift 9s linear infinite;
    }

    @keyframes drift {
      from { background-position: 0% 50%; }
      to   { background-position: 300% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1::before { animation: none; }
    }
  </style>
</head>
<body>
  <h1 data-text="hecktyc">hecktyc</h1>
</body>
</html>
