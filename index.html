      background-size: 64px 64px; /* half the tile size = specks half as big (on screens sharper than 1x) */
      animation: grain 1.2s steps(1) infinite; /* about 7 jumps a second: filmic, and light on the GPU */
    }
    @keyframes grain {
      0%   { transform: translate(0, 0); }
      11%  { transform: translate(-3%, 2%); }
      22%  { transform: translate(3%, -3.5%); }
      33%  { transform: translate(-4%, 3.5%); }
      44%  { transform: translate(3.5%, 1.5%); }
      55%  { transform: translate(-1.5%, -4%); }
      66%  { transform: translate(4%, 3.5%); }
      77%  { transform: translate(-3.5%, -1.5%); }
      88%  { transform: translate(1.5%, 4%); }
    }

    /* ---------- small heading, top centre ---------- */
    .top {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 2rem);
      left: 0;
      right: 0;
      z-index: 1; /* behind the eye, so the growing eye swallows it */
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    h1 {
      display: flex;
      justify-content: center;
      margin: 0;
      line-height: 1;
      padding-left: 0.16em; /* balances the trailing letter-spacing so the word sits centred */
      perspective: 900px;
      color: var(--fg);
      font-family: var(--font);
      font-weight: 400;
      font-size: clamp(1rem, 3vw, 2rem); /* the script below refines this */
      letter-spacing: 0.16em;
      text-transform: lowercase;
      text-shadow: var(--glow);
    }

    h1 span {
      position: relative;
      display: inline-block;
      transform-origin: 50% 60%;
      animation: bubble calc(6s + var(--i) * 0.4s) ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.35s);
    }

    @keyframes bubble {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
      }
      30% {
        transform: translate3d(var(--sx), -0.2em, 40px)
                   rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(1.04);
      }
      55% {
        transform: translate3d(0, -0.34em, 70px)
                   rotateX(calc(var(--rx) * -0.6)) rotateY(calc(var(--ry) * -1)) rotateZ(calc(var(--rz) * -1)) scale(1.07);
      }
      80% {
        transform: translate3d(calc(var(--sx) * -1), -0.12em, 25px)
                   rotateX(calc(var(--rx) * 0.4)) rotateY(calc(var(--ry) * 0.5)) rotateZ(calc(var(--rz) * 0.5)) scale(1.02);
      }
    }

    /* ---------- the eye, centred on the front page ---------- */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      perspective: 1500px;
      pointer-events: none;
    }

    .reveal {
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.on { opacity: 1; transform: none; }

    .clock {
      position: relative;
      width: min(90vw, 510px, 78vh);
      aspect-ratio: 1;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* soft white glow: one static gradient (no blur filter), so it costs almost nothing to draw */
    .eye-glow {
      position: absolute;
      inset: -25%;
      pointer-events: none;
      transform: translateZ(60px);
      background: radial-gradient(ellipse 46% 31% at 50% 50%,
        rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.28) 38%,
        rgba(255, 255, 255, 0.10) 62%, rgba(255, 255, 255, 0) 100%);
    }

    /* once the cursor tilt has faded out (zoom 30%), flatten the 3D scene: same picture, much cheaper to draw */
    .clock.flat { transform-style: flat; }
    .clock.flat .eye-svg { transform: scale(1.0638); } /* the size the 90px of depth gave it, so nothing jumps */
    .clock.flat .eye-glow { transform: scale(1.0417); }
    .covered .top { visibility: hidden; } /* the eye has swallowed the heading, so stop drawing it */
    .scrolling body::after { animation-play-state: paused; } /* the grain holds still while you scroll */

    .eye-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      transform: translateZ(90px); /* floats in front, so tilting shows depth */
    }
    .lid-line { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linejoin: round; }
    .lash { fill: #fff; stroke: #fff; stroke-width: 1.5; stroke-linejoin: round; }

    /* ---------- tiny social icons + e-mail, bottom centre ---------- */
    .links {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .icons { display: flex; gap: 0.35rem; }
    .icons a {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.75);
    }
    .icons a:hover, .icons a:focus-visible { color: #fff; filter: drop-shadow(0 0 4px #fff); }
    .icons a:focus-visible, .mail:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .icons svg {
      width: 1.05rem;
      height: 1.05rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mail {
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-decoration: none;
    }
    .mail:hover, .mail:focus-visible { color: #fff; }

    /* ---------- scroll arrow ---------- */
    .scroll-hint {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 5.4rem);
      z-index: 10;
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      margin: 0 0 0 -1.25rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      color: #fff;
      cursor: pointer;
    }
    .scroll-hint svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
      animation: nudge 2.2s ease-in-out infinite;
    }
    .scroll-hint:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    @keyframes nudge {
      0%, 100% { transform: translateY(-3px); opacity: 0.6; }
      50%      { transform: translateY(5px);  opacity: 1; }
    }

    /* ---------- the hub: five paths orbiting the middle of the pupil ---------- */
    .hub {
      position: fixed;
      inset: 0;
      z-index: 3;
      background: #000;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      contain: layout paint;
    }
    .hub-stage {
      --R: min(30vmin, 260px);
      --n: clamp(3.4rem, 8.5vmin, 4.6rem);
      position: absolute;
      left: 50%;
      top: 46%;
      width: 0;
      height: 0;
    }
    .ring {
      position: absolute;
      left: calc(var(--R) * -1);
      top: calc(var(--R) * -1);
      width: calc(var(--R) * 2);
      height: calc(var(--R) * 2);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 50%;
    }
    .ring.inner { transform: scale(0.58); border-color: rgba(255, 255, 255, 0.08); }
    .core {
      position: absolute;
      left: -4px;
      top: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.12), 0 0 18px rgba(255, 255, 255, 0.5);
      animation: pulse 3s ease-in-out infinite;
    }
    .orbit { position: absolute; inset: 0; animation: spin 80s linear infinite; }
    .node {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      color: #fff;
      text-decoration: none;
      transform: rotate(calc(var(--k) * 72deg)) translateY(calc(var(--R) * -1)) rotate(calc(var(--k) * -72deg));
    }
    .node-in {
      position: absolute;
      left: calc(var(--n) / -2);
      top: calc(var(--n) / -2);
      width: var(--n);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      animation: unspin 80s linear infinite; /* cancels the orbit's turn, so labels stay upright */
    }
    .orb {
      display: grid;
      place-items: center;
      width: var(--n);
      height: var(--n);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.9);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .orb svg {
      width: 44%;
      height: 44%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .lab {
      font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
    }
    .node:hover .orb, .node:focus-visible .orb {
      transform: scale(1.18);
      border-color: #fff;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.5);
    }
    .node:focus-visible { outline: none; }
    .node:focus-visible .orb { outline: 2px solid #fff; outline-offset: 3px; }
    /* hold still while you aim at one, and while the hub is not on screen */
    .orbit:hover, .orbit:hover .node-in, .orbit:focus-within, .orbit:focus-within .node-in,
    .hub:not(.on) .orbit, .hub:not(.on) .node-in, .hub:not(.on) .core { animation-play-state: paused; }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes unspin { to { transform: rotate(-360deg); } }
    @keyframes pulse  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }

    /* lite mode: no moving grain */
    .lite body::after { animation: none; }

    @media (prefers-reduced-motion: reduce) {
      h1 span, .scroll-hint svg, .orbit, .node-in, .core { animation: none; }
      .reveal { transition: none; }
    }
  </style>

  <script>
    /* the eye: follows the cursor and blinks; scrolling zooms into the pupil, where the hub waits */
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var root = document.documentElement;
      var reveal = document.querySelector('.reveal');
      var clock = document.getElementById('clock');
      var svg = clock.querySelector('.eye-svg');
      var iris = clock.querySelector('.iris');
      var lids = clock.querySelectorAll('.lid-d');
      var lashes = clock.querySelector('.lashes');
      var glow = clock.querySelector('.eye-glow');
      var hub = document.getElementById('hub');
      var hint = document.getElementById('hint');
      var space = document.getElementById('space');

      /* ---------- geometry ---------- */
      var PF = 1500 / (1500 - 90);          // perspective boost of the eye (it floats 90px in front)
      var W = 0, H = 0, zoomDist = 1, size = 510, vbEnd = 10, jumped = false;
      var lastP = -1, lastHint = -1, flat = false, zoomed = false, covered = false, hubOn = false;
      function layout() {
        W = window.innerWidth; H = window.innerHeight;
        zoomDist = 1.6 * H;                  // how far you scroll to fly into the pupil
        size = clock.offsetWidth;
        // final zoom: the pupil (radius 11 of 200 units) is big enough to cover the whole screen
        vbEnd = 11 * size * PF / (Math.hypot(W, H) / 2 * 1.05);
        space.style.height = (zoomDist + H) + 'px'; // the hub is one screen, so the page ends when the zoom does
        // coming back from one of the pages (index.html#hub): land straight in the hub
        if (!jumped && location.hash === '#hub') { jumped = true; window.scrollTo(0, zoomDist); }
        lastP = -1;
      }
      window.addEventListener('resize', layout);
      window.addEventListener('load', layout);

      var scrollTimer = 0;
      window.addEventListener('scroll', function () {
        root.classList.add('scrolling');
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function () { root.classList.remove('scrolling'); }, 140);
      }, { passive: true });
      hint.addEventListener('click', function () {
        window.scrollTo({ top: zoomDist, behavior: reduce ? 'auto' : 'smooth' });
      });

      /* ---------- cursor ---------- */
      var tx = 0, ty = 0, cx = 0, cy = 0; // from -1 to 1
      var lastMove = performance.now(), nextLook = 0;
      window.addEventListener('pointermove', function (e) {
        tx = (e.clientX / window.innerWidth - 0.5) * 2;
        ty = (e.clientY / window.innerHeight - 0.5) * 2;
        lastMove = performance.now();
      }, { passive: true });

      function setLid(o) { // o = how open the lids are (1 = open); iris and pupil never change size
        var h = 60 * o;
        var d = 'M36 100Q100 ' + (100 - h) + ' 164 100Q100 ' + (100 + h) + ' 36 100Z';
        for (var k = 0; k < lids.length; k++) lids[k].setAttribute('d', d);
        lashes.setAttribute('transform', 'translate(0 100) scale(1 ' + o + ') translate(0 -100)');
      }

      // p = 0 (eye at rest) to 1 (inside the pupil)
      function apply(p) {
        var near = 1 - Math.min(1, p / 0.3);  // cursor influence fades out so the pupil ends up dead centre
        if (p >= 0.3) { // cursor tilt is gone, so drop the 3D transforms entirely
          if (!flat) { flat = true; clock.classList.add('flat'); clock.style.transform = 'none'; }
        } else {
          if (flat) { flat = false; clock.classList.remove('flat'); }
          clock.style.transform =
            'translate3d(' + (cx * 60 * near) + 'px,' + (cy * 42 * near) + 'px,0) ' +
            'rotateX(' + (-cy * 24 * near) + 'deg) rotateY(' + (cx * 24 * near) + 'deg)';
        }
        var zd = p > 0.05, cv = p > 0.55; // pause the heading while zooming, hide it once it is covered
        if (zd !== zoomed) { zoomed = zd; root.classList.toggle('zoomed', zd); }
        if (cv !== covered) { covered = cv; root.classList.toggle('covered', cv); }
        iris.setAttribute('transform', 'translate(' + (cx * 16 * near) + ' ' + (cy * 7 * near) + ')');

        glow.style.opacity = Math.max(0, 1 - p * 4);
        var w = 200 * Math.pow(vbEnd / 200, p); // zoom by shrinking the visible window around the pupil
        svg.setAttribute('viewBox', (100 - w / 2) + ' ' + (100 - w / 2) + ' ' + w + ' ' + w);

        // the hub is visible only inside the pupil, and its window grows exactly with the pupil
        var q = Math.min(1, Math.max(0, (p - 0.3) / 0.2));
        hub.style.opacity = q;
        hub.style.visibility = q > 0 ? 'visible' : 'hidden';
        hub.style.pointerEvents = p > 0.97 ? 'auto' : 'none'; // clickable once it fills the screen
        if ((q > 0) !== hubOn) { hubOn = q > 0; hub.classList.toggle('on', hubOn); }
        var rp = 11 * size / w * PF;
        hub.style.clipPath = rp > Math.hypot(W, H) / 2 * 1.02 ? 'none' : 'circle(' + rp + 'px at 50% 50%)';
      }

      var BLINK_MS = 160, blinkStart = -1, nextBlink = performance.now() + 2500;
      function loop(now) {
        requestAnimationFrame(loop);
        var y = window.pageYOffset || 0;
        var p = Math.min(1, Math.max(0, y / zoomDist));
        // no cursor movement for 5 seconds: the eye starts looking around by itself
        if (!reduce && p < 0.3 && now - lastMove > 5000 && now >= nextLook) {
          tx = (Math.random() * 2 - 1) * 0.9;
          ty = (Math.random() * 2 - 1) * 0.7;
          nextLook = now + 1100 + Math.random() * 1800;
        }
        var moving = !reduce && (Math.abs(tx - cx) > 0.0005 || Math.abs(ty - cy) > 0.0005);
        if (moving) { cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08; }
        if (p !== lastP || (moving && p < 0.3)) { apply(p); lastP = p; }

        var o = Math.max(0, 1 - y / (H * 0.2)); // arrow fades away as soon as you scroll
        if (o !== lastHint) { lastHint = o; hint.style.opacity = o; hint.style.visibility = o <= 0 ? 'hidden' : 'visible'; }

        if (reduce) return;
        if (p > 0.02) { if (blinkStart >= 0) { setLid(1); blinkStart = -1; } return; } // no blinking while zooming
        if (blinkStart < 0 && now >= nextBlink) blinkStart = now;
        if (blinkStart >= 0) {
          var t = (now - blinkStart) / BLINK_MS;
          if (t >= 1) { setLid(1); blinkStart = -1; nextBlink = now + 3000 + Math.random() * 3500; }
          else setLid(1 - 0.93 * Math.sin(Math.PI * t));
        }
      }

      layout();
      reveal.classList.add('on');
      requestAnimationFrame(loop);
    })();
  </script>

  <script>
    /* keeps the heading small (about 140 px wide); every letter swaps to a random font on its own */
    (function () {
      var root = document.documentElement;
      var lite = root.className.indexOf('lite') > -1;
      var INTERVAL = lite ? 160 : 100; // how often the letters are checked, in milliseconds
      var h1 = document.querySelector('h1');
      var letters = h1.querySelectorAll('span');
      var n = letters.length;

      var fonts = [
        ['Michroma', 400], ['Syncopate', 700], ['Orbitron', 800], ['Audiowide', 400],
        ['Righteous', 400], ['Zen Dots', 400], ['Bungee', 400], ['Alfa Slab One', 400],
        ['Abril Fatface', 400], ['Playfair Display', 900], ['Cinzel', 800], ['UnifrakturCook', 700],
        ['Pacifico', 400], ['Permanent Marker', 400], ['Rubik Glitch', 400], ['Wallpoet', 400],
        ['Bruno Ace', 400], ['Chakra Petch', 700], ['Tektur', 800], ['Oxanium', 800],
        ['Monoton', 400] // the CSS default
      ];
      var cur = [], due = [], k;
      for (k = 0; k < n; k++) { cur.push(fonts.length - 1); due.push(0); }
      var size = parseFloat(getComputedStyle(h1).fontSize) || 60;
      var ratios = null; // ratios[font][letter] = that letter's width per 1px of font size (measured once)

      function share() { return Math.min(0.275, Math.max(0.07, 140 / root.clientWidth)); } // 140 px, but 7% to 27.5% of the width
      function setFont(i, f) {
        letters[i].style.fontFamily = '"' + fonts[f][0] + '", "Segoe UI", sans-serif';
        letters[i].style.fontWeight = fonts[f][1];
        cur[i] = f;
      }
      function sumWidths() {
        var w = 0;
        for (var i = 0; i < n; i++) w += letters[i].offsetWidth;
        return w;
      }
      function fit() {
        if (ratios) {
          var t = 0;
          for (var i = 0; i < n; i++) t += ratios[cur[i]][i];
          size = share() * root.clientWidth / t;
        } else {
          var w = sumWidths();
          if (!w) return;
          size = size * (share() * root.clientWidth) / w;
        }
        h1.style.fontSize = size + 'px';
      }
      function measureAll() {
        var keep = cur.slice(), r = [], f, i;
        h1.style.fontSize = '100px';
        for (f = 0; f < fonts.length; f++) {
          for (i = 0; i < n; i++) setFont(i, f);
          var row = [];
          for (i = 0; i < n; i++) row.push(letters[i].offsetWidth / 100);
          r.push(row);
        }
        ratios = r;
        for (i = 0; i < n; i++) setFont(i, keep[i]);
        fit();
      }

      window.addEventListener('resize', fit);
      fit();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!ratios) fit(); });
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var timer = null;
      function tick() {
        if (root.classList.contains('zoomed')) return;
        var now = performance.now(), changed = false;
        for (var i = 0; i < n; i++) {
          if (now < due[i]) continue;
          var f;
          do { f = Math.floor(Math.random() * fonts.length); } while (f === cur[i]);
          setFont(i, f);
          due[i] = now + 120 + Math.random() * 380; // each letter has its own rhythm
          changed = true;
        }
        if (changed) fit();
      }
      function run() { if (!timer && !document.hidden) timer = setInterval(tick, INTERVAL); }
      function halt() { clearInterval(timer); timer = null; }
      function go() { measureAll(); run(); }

      document.addEventListener('visibilitychange', function () { if (document.hidden) halt(); else run(); });
      // start only once every font has loaded, so you never see fallback fonts flash by
      Promise.all(fonts.map(function (f) {
        return document.fonts.load(f[1] + ' 1em "' + f[0] + '"', 'hecktyc');
      })).then(go, go);
    })();
  </script>
